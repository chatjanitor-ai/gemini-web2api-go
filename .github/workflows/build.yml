# Canonical workflow: sync to the fork with ./sync-deployment-files.sh.
# Build the Gemini web image, then dispatch janitor-infra deployment.
name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/chatjanitor-ai
  IMAGE_NAME: gemini-web2api-go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=gemini-web2api-go
          cache-to: type=gha,mode=max,scope=gemini-web2api-go

  dispatch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger infra deploy
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::INFRA_DISPATCH_TOKEN is empty"
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/chatjanitor-ai/janitor-infra/dispatches \
            -d '{"event_type":"deploy","client_payload":{"services":"gemini-web2api-go"}}'
